<!DOCTYPE html>
<html>
<head>
    <title>Media Server</title>
</head>

<body>

<h1>Send File to Media Server</h1>

<form id="upload-form">
    <input type="file" id="file-input" required>
    <label for="transfer-mode">Transmission mode:</label>

<select id="transfer-mode">
    <option value="unrestricted">Unrestricted</option>
    <option value="fixed">Fixed rate</option>
    <option value="adaptive" selected>Adaptive</option>
</select>
    <fieldset>
    <legend>Experimental Settings</legend>

    <label>Fixed/initial rate (MiB/s):</label>
    <input type="number" id="target-rate"
           value="2" min="0.5" step="0.25" required>
    <br>

    <label>Maximum adaptive rate (MiB/s):</label>
    <input type="number" id="max-rate"
           value="8" min="0.5" step="0.25" required>
    <br>

    <label>Additive increase (MiB/s):</label>
    <input type="number" id="increase-rate"
           value="0.25" min="0.05" step="0.05" required>
    <br>

    <label>Multiplicative decrease:</label>
    <input type="number" id="decrease-factor"
           value="0.7" min="0.1" max="0.99"
           step="0.01" required>
    <br>

    <label>Latency margin (ms):</label>
    <input type="number" id="latency-margin"
           value="20" min="1" step="1" required>
    <br>

    <label>Consecutive high probes:</label>
    <input type="number" id="high-probe-count"
           value="2" min="1" step="1" required>
</fieldset>
    <button type="submit">Upload</button>
</form>

<p id="status"></p>

<script src="{{ url_for('static', filename='sha256.min.js') }}"></script>

<script>
    const form = document.getElementById("upload-form");
    const fileInput = document.getElementById("file-input");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    function exportCSV(data, filename) {
    if (data.length === 0) return;

    const headers = Object.keys(data[0]);

    const rows = data.map(row =>
        headers.map(header => row[header] ?? "").join(",")
    );

    const csv = [headers.join(","), ...rows].join("\n");

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const file = fileInput.files[0];
        if (!file || file.size === 0) return;

        const chunkSize = 1024 * 1024;
        const totalChunks = Math.ceil(file.size / chunkSize);
        const transferMode = document.getElementById("transfer-mode").value;
        
        const targetRateBps =
        Number(document.getElementById("target-rate").value) * 1024 * 1024;

        const configuredMaxRateBps =
            Number(document.getElementById("max-rate").value) * 1024 * 1024;

        const configuredIncreaseBps =
            Number(document.getElementById("increase-rate").value) * 1024 * 1024;

        const decreaseFactor =
            Number(document.getElementById("decrease-factor").value);

        const latencyMarginMs =
            Number(document.getElementById("latency-margin").value);

        const configuredProbeCount =
            Number(document.getElementById("high-probe-count").value);

        if (transferMode === "adaptive" &&
            targetRateBps > configuredMaxRateBps) {

            status.textContent = "Initial rate cannot exceed maximum rate.";
            return;
    }
            const uploadKey = `upload:${file.name}:${file.size}:${file.lastModified}`;
        
        let uploadId = localStorage.getItem(uploadKey) || "";
        let startIndex = 0;

        const probeMetrics = [];
        let transferStart = null;

        let latestProbeMs = null;
        let latestProbeAt = null;
        let baselineProbeMs = Infinity;
        let smoothedProbeMs = null;
        let consecutiveHighProbes = 0;

        const probeSmoothingFactor = 0.3;
        const probeSlowdownThreshold = configuredProbeCount;
        let probeTimer = null;
        let probeInFlight = false;

        const probeIntervalMs = 500;
        const probeController = new AbortController();

       button.disabled = true;

       async function measureLatency() {
    if (probeInFlight || probeController.signal.aborted) return;

    probeInFlight = true;

    const probeStart = performance.now();

    try {
        const response = await fetch("/latency-probe", {
            cache: "no-store",
            signal: probeController.signal
        });

        if (!response.ok) {
            throw new Error("Latency probe failed");
        }

        latestProbeMs = performance.now() - probeStart;
        latestProbeAt = performance.now();

        baselineProbeMs = Math.min(
        baselineProbeMs,
        latestProbeMs
    );

        if (smoothedProbeMs === null) {
            smoothedProbeMs = latestProbeMs;
        } else {
            smoothedProbeMs =
                probeSmoothingFactor * latestProbeMs +
                (1 - probeSmoothingFactor) * smoothedProbeMs;
        }

        const probeCongestionThreshold = Math.max(
            baselineProbeMs * 2,
            baselineProbeMs + latencyMarginMs
        );

        if (latestProbeMs > probeCongestionThreshold) {
            consecutiveHighProbes++;
        } else {
            consecutiveHighProbes = 0;
        }

        probeMetrics.push({
        elapsed_seconds:
            (performance.now() - transferStart) / 1000,
        latency_ms: latestProbeMs,
        baseline_ms: baselineProbeMs,
        smoothed_latency_ms: smoothedProbeMs,
        consecutive_high_probes: consecutiveHighProbes
    });

        console.log(
            `Probe latency: ${latestProbeMs.toFixed(2)} ms`
        );

    } catch (error) {
        if (!probeController.signal.aborted) {
            console.warn("Latency probe failed:", error.message);
        }

    } finally {
        probeInFlight = false;
    }
}

try {
    if (uploadId) {

        const response = await fetch(
            `/upload-status?upload_id=${encodeURIComponent(uploadId)}`
        );

        const saved = await response.json();

        if (response.status === 404) {
            localStorage.removeItem(uploadKey);
            uploadId = "";

        } else if (!response.ok) {
            throw new Error(saved.error || "Could not check upload status");

        } else {
            if (saved.total !== totalChunks ||
                !Number.isInteger(saved.next_index) ||
                saved.next_index < 0 ||
                saved.next_index >= totalChunks ||
                saved.bytes_received !== saved.next_index * chunkSize) {
                throw new Error("Saved upload progress is inconsistent");
            }

            startIndex = saved.next_index;

            status.textContent =
                `Resuming from chunk ${startIndex + 1} / ${totalChunks}`;

            console.log(`Resuming from chunk ${startIndex}`);
        }
    }

    transferStart = performance.now();
    const chunkMetrics = [];

    measureLatency();

    probeTimer = setInterval(
        measureLatency,
        probeIntervalMs
    );

    let adaptiveRateBps = targetRateBps;
    const minRateBps = 0.5 * 1024 * 1024;
    const maxRateBps = configuredMaxRateBps;
    const increaseBps = configuredIncreaseBps;

    let baselineChunkMs = Infinity;
    let nextChunkAt = performance.now();


    let smoothedChunkMs = null;
    const smoothingFactor = 0.3;

    let consecutiveSlowRequests = 0;
    const slowdownThreshold = 2;

                for (let i = startIndex; i < totalChunks; i++) {
                            if (transferMode === "fixed") {
                const bytesScheduled = (i - startIndex) * chunkSize;

                const targetElapsedMs =
                    (bytesScheduled / targetRateBps) * 1000;

                const elapsedMs = performance.now() - transferStart;

                const delayMs = Math.max(0, targetElapsedMs - elapsedMs);

                if (delayMs > 0) {
                    await new Promise(resolve => setTimeout(resolve, delayMs));
                }
            }
                if (transferMode === "adaptive") {
                        const waitMs = Math.max(
                            0,
                            nextChunkAt - performance.now()
                        );

                        if (waitMs > 0) {
                            await new Promise(resolve => setTimeout(resolve, waitMs));
                        }
                    }

                const start = i * chunkSize;
                const end = Math.min(start + chunkSize, file.size);

                const chunk = file.slice(start, end);

                const chunkBytes = await chunk.arrayBuffer();
                const chunkHash = sha256 (chunkBytes);
                console.log(`Chunk ${i} SHA-256: ${chunkHash}`);

                const formData = new FormData();

                formData.append("chunk", chunk, "chunk.bin");
                formData.append("sha256", chunkHash);
                formData.append("filename", file.name);
                formData.append("index", i);
                formData.append("total", totalChunks);
                formData.append("upload_id", uploadId);

                const requestStart = performance.now();

                const response = await fetch("/upload-chunk", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Upload failed");
                }

                const requestMs = performance.now() - requestStart;

                if (transferMode === "adaptive") {
                    
                    if (chunk.size === chunkSize) {

                    baselineChunkMs = Math.min(baselineChunkMs, requestMs);

                    if (smoothedChunkMs === null) {
                        smoothedChunkMs = requestMs;
                    } else {
                        smoothedChunkMs =
                            smoothingFactor * requestMs +
                            (1 - smoothingFactor) * smoothedChunkMs;
                    }

                    const congestionThreshold = Math.max(
                        baselineChunkMs * 1.5,
                        baselineChunkMs + 100
                    );

                    if (requestMs > congestionThreshold) {
                        consecutiveSlowRequests++;
                    } else {
                        consecutiveSlowRequests = 0;
                    }

                    const probeCongestionThreshold = Math.max(
                        baselineProbeMs * 2,
                        baselineProbeMs + latencyMarginMs
                    );

                    const probeFresh =
                        latestProbeAt !== null &&
                        performance.now() - latestProbeAt <= 1500;

                    const sustainedHighLatency =
                        probeFresh &&
                        smoothedProbeMs > probeCongestionThreshold &&
                        consecutiveHighProbes >= probeSlowdownThreshold;

                    const latencyHealthy =
                        probeFresh &&
                        latestProbeMs <= probeCongestionThreshold &&
                        smoothedProbeMs <= probeCongestionThreshold;

                    const chunksHealthy =
                        smoothedChunkMs <= congestionThreshold &&
                        consecutiveSlowRequests === 0;

                    if (sustainedHighLatency) {

                        adaptiveRateBps = Math.max(
                            minRateBps,
                            adaptiveRateBps * decreaseFactor
                        );

                        consecutiveHighProbes = 0;

                        console.log("Sustained high latency detected");
                    } else if (latencyHealthy && chunksHealthy) {

                        adaptiveRateBps = Math.min(
                            maxRateBps,
                            adaptiveRateBps + increaseBps
                        );
                    }
                }
                    nextChunkAt = requestStart +
                        (chunk.size / adaptiveRateBps) * 1000;

                    console.log(
                    `Adaptive rate: ${(adaptiveRateBps / (1024 * 1024)).toFixed(2)} MiB/s` +
                    ` | Request: ${requestMs.toFixed(1)} ms` +
                    ` | Smoothed chunk: ${smoothedChunkMs?.toFixed(1) ?? "N/A"} ms` +
                    ` | Smoothed latency: ${smoothedProbeMs?.toFixed(1) ?? "N/A"} ms`
                        );
                        }
                
                chunkMetrics.push({
                    mode: transferMode,
                    chunk: i,
                    chunk_size_bytes: chunk.size,
                    elapsed_seconds:
                        (performance.now() - transferStart) / 1000,
                    request_ms: requestMs,
                    probe_latency_ms: latestProbeMs,
                    smoothed_latency_ms: smoothedProbeMs,
                    target_rate_mib:
                        transferMode === "adaptive"
                            ? adaptiveRateBps / (1024 * 1024)
                            : transferMode === "fixed"
                                ? targetRateBps / (1024 * 1024)
                                : null
                });

                uploadId = result.upload_id;
                localStorage.setItem(uploadKey, uploadId);

                status.textContent =
                    `Uploaded ${i + 1} / ${totalChunks} chunks`;

                console.log(`Sent chunk ${i}`);
            }

            const elapsedSeconds = (performance.now() - transferStart) / 1000;

            const bytesTransferred = file.size - startIndex * chunkSize;

            const averageThroughput =
                (bytesTransferred / (1024 * 1024)) / elapsedSeconds;

            console.log("Chunk measurements:");
            console.table(chunkMetrics);

            console.log("Latency measurements:");
            console.table(probeMetrics);
            const timestamp = new Date().toISOString().replace(/[:.]/g, "-");

            const experimentSummary = [{
                    mode: transferMode,
                    transfer_start_utc: new Date(
                        performance.timeOrigin + transferStart
                    ).toISOString(),
                    file_size_bytes: file.size,
                    chunk_size_bytes: chunkSize,
                    bytes_transferred: bytesTransferred,
                    transfer_time_seconds: elapsedSeconds,
                    average_throughput_mib_s: averageThroughput,
                    initial_rate_mib_s: targetRateBps / (1024 * 1024),
                    min_rate_mib_s: minRateBps / (1024 * 1024),
                    max_rate_mib_s: maxRateBps / (1024 * 1024),
                    additive_increase_mib_s: increaseBps / (1024 * 1024),
                    decrease_factor: decreaseFactor,
                    latency_margin_ms: latencyMarginMs,
                    high_probe_threshold: probeSlowdownThreshold,
                    probe_interval_ms: probeIntervalMs,
                    probe_smoothing_factor: probeSmoothingFactor,
                    chunk_smoothing_factor: smoothingFactor
                }];

exportCSV(
    experimentSummary,
    `${transferMode}_${timestamp}_summary.csv`
);

            exportCSV(
                chunkMetrics,
                `${transferMode}_${timestamp}_chunks.csv`
            );

            exportCSV(
                probeMetrics,
                `${transferMode}_${timestamp}_latency.csv`
            );
            console.log(`Transfer time: ${elapsedSeconds.toFixed(2)} seconds`);
            console.log(`Average throughput: ${averageThroughput.toFixed(2)} MiB/s`);

            status.textContent = "Upload complete!";
            localStorage.removeItem(uploadKey);

        } catch (error) {
            status.textContent = `Upload failed: ${error.message}`;

        } finally {
            clearInterval(probeTimer);
            probeController.abort();

            button.disabled = false;
        }
    });
</script>

</body>
</html>

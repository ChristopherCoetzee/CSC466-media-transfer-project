<!DOCTYPE html>
<html>
<head>
    <title>Media Server</title>
</head>

<body>

<h1>Send File to Media Server</h1>

<form id="upload-form">
    <p>Select movies or individual subtitle files:</p>
    <input type="file" id="file-input" multiple>

    <p>Or select a movie folder:</p>
    <input type="file" id="folder-input" webkitdirectory multiple>

    <button type="submit">Upload</button>
</form>

<p id="status"></p>

<script src="{{ url_for('static', filename='sha256.min.js') }}"></script>

<script>
    const form = document.getElementById("upload-form");
    const fileInput = document.getElementById("file-input");
    const folderInput = document.getElementById("folder-input");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const files = [...fileInput.files, ...folderInput.files]
    .filter(file => file.size > 0);

if (!files.length) return;

button.disabled = true;

try {
    for (const file of files) {
        const relativePath = file.webkitRelativePath || file.name;

        const chunkSize = 1024 * 1024;
        const totalChunks = Math.ceil(file.size / chunkSize);
        const uploadKey = `upload:${relativePath}:${file.size}:${file.lastModified}`;

        // Skip files previously completed in this browser
        if (localStorage.getItem(uploadKey) === "done") continue;

        let uploadId = localStorage.getItem(uploadKey) || "";
        let startIndex = 0;
    if (uploadId) {

        const response = await fetch(
            `/upload-status?upload_id=${encodeURIComponent(uploadId)}`
        );

        const saved = await response.json();

        if (response.status === 404) {
            // The server no longer knows this upload.
            // Begin a new upload instead.
            localStorage.removeItem(uploadKey);
            uploadId = "";

        } else if (!response.ok) {
            throw new Error(saved.error || "Could not check upload status");

        } else {
            // Verify that the saved progress is consistent.
            if (saved.total !== totalChunks ||
                !Number.isInteger(saved.next_index) ||
                saved.next_index < 0 ||
                saved.next_index >= totalChunks ||
                saved.bytes_received !== saved.next_index * chunkSize) {
                throw new Error("Saved upload progress is inconsistent");
            }

            startIndex = saved.next_index;

            status.textContent =
                `Resuming from chunk ${startIndex + 1} / ${totalChunks}`;

            console.log(`Resuming from chunk ${startIndex}`);
        }
    }

    for (let i = startIndex; i < totalChunks; i++) {
                const start = i * chunkSize;
                const end = Math.min(start + chunkSize, file.size);

                const chunk = file.slice(start, end);

                const chunkBytes = await chunk.arrayBuffer();
                const chunkHash = sha256 (chunkBytes);
                console.log(`Chunk ${i} SHA-256: ${chunkHash}`);

                const formData = new FormData();

                formData.append("chunk", chunk, "chunk.bin");
                formData.append("sha256", chunkHash);
                formData.append("filename", file.name);
                formData.append("relative_path", relativePath);
                formData.append("index", i);
                formData.append("total", totalChunks);
                formData.append("upload_id", uploadId);

                const response = await fetch("/upload-chunk", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Upload failed");
                }

                uploadId = result.upload_id;
                localStorage.setItem(uploadKey, uploadId);

                status.textContent =
                    `Uploaded ${i + 1} / ${totalChunks} chunks`;

                console.log(`Sent chunk ${i}`);
            }

                    localStorage.setItem(uploadKey, "done");
        status.textContent = `Finished: ${relativePath}`;
    }

    status.textContent = "All selected files uploaded!";

        } catch (error) {
            status.textContent = `Upload failed: ${error.message}`;

        } finally {
            button.disabled = false;
        }
    });
</script>

</body>
</html>
